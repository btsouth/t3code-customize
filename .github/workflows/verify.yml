name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check the macOS loader parses
        run: node --check macos/inject.cjs && node --check macos/connect.mjs
      - name: Apply patches to their base and run the checks
        run: ./t3code-customize verify
      - name: Show the log on failure
        if: failure()
        run: tail -n 200 ~/.cache/t3code-customize/logs/*.log
